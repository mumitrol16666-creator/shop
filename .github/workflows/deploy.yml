name: Validate Shop

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build storefront
        run: npm run build

      - name: Run tests
        run: node --test tests/*.test.mjs
