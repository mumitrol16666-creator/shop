name: Deploy to Production Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting deployment on server..."
            
            # 1. Go to project directory
            cd ${{ secrets.DEPLOY_PATH || '/var/www/shop.maestro.com.kz' }}

            # Preserve the live catalog before replacing tracked application files.
            mkdir -p .runtime-data/uploads
            if [ ! -f .runtime-data/products.json ] && [ -f data/products.json ]; then
              cp data/products.json .runtime-data/products.json
            fi
            if [ ! -f .runtime-data/courses.json ] && [ -f data/courses.json ]; then
              cp data/courses.json .runtime-data/courses.json
            fi
            if [ -d public/uploads ]; then
              cp -Rn public/uploads/. .runtime-data/uploads/ || true
            fi
            
            # 2. Pull latest code from main
            git fetch origin main
            git reset --hard origin/main
            
            # 3. Install dependencies
            npm install --legacy-peer-deps
            
            # 4. Build application
            npm run build
            
            # 5. Restart with PM2
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save
            
            echo "✅ Deployment successful! Server reloaded."
